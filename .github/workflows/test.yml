name: Unit Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: |
          echo "Installing dependencies"
          yarn install

      - name: Run tests
        run: |
          echo "Running tests"
          yarn run test:cov
