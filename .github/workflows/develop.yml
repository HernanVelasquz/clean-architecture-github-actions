name: Development Pipeline

run-name: Development to ${{ github.event.pull_request.title }} by ${{ github.actor }}

on:
  push:
  pull_request:
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  call-linter:
    uses: ./.github/workflows/linter.yml
  call-test:
    needs: call-linter
    uses: ./.github/workflows/test.yml
